name = "questpulse-api"
main = "src/index.js"
compatibility_date = "2026-11-10"
workers_dev = true

# Create a D1 database, then replace the database_id placeholder below.
[[d1_databases]]
binding = "DB"
database_name = "questpulse"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Set this to the exact public website origin before production deployment.
# Example: https://getquestpulse.com
ALLOWED_ORIGIN = "https://getquestpulse.com"
