<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="قائمة QuestPulse العملية لحماية الحسابات والأجهزة."><meta name="theme-color" content="#090e1b"><title>QuestPulse | حماية الحسابات</title><style>:root{color-scheme:dark;--bg:#090e1b;--panel:#121d31;--line:#ffffff1c;--text:#f4f7ff;--muted:#a5b2c8;--cyan:#68d9d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,Tahoma,Arial,sans-serif}.wrap{width:min(850px,92%);margin:auto}header{border-bottom:1px solid var(--line)}nav{min-height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.3rem;font-weight:900;color:var(--text);text-decoration:none}.brand span,a{color:var(--cyan)}main{padding:32px 0}.panel{padding:20px;margin:14px 0;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input{margin-top:8px;accent-color:var(--cyan);width:18px;height:18px}.item label{flex:1}.item small{display:block;color:var(--muted)}.muted{color:var(--muted)}.progress{height:9px;background:#ffffff14;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#a99bff,#68d9d0)}</style></head><body><header><div class="wrap"><nav><a class="brand" href="./index.html">Quest<span>Pulse</span></a><a href="./index.html">الرئيسية</a></nav></div></header><main class="wrap"><h1>قائمة حماية الحسابات</h1><p class="muted">ضع علامة أمام كل خطوة أنجزتها. التقدم يُحسب داخل هذه الصفحة فقط.</p><div class="panel"><div id="count" class="muted">0 من 12 خطوات مكتملة</div><div class="progress"><span id="bar"></span></div></div><section class="panel"><h2>كلمات المرور وتسجيل الدخول</h2><div class="item"><input type="checkbox"><label>استخدم كلمة مرور طويلة وفريدة لكل حساب.</label></div><div class="item"><input type="checkbox"><label>فعّل المصادقة الثنائية.</label></div><div class="item"><input type="checkbox"><label>احفظ رموز الاسترداد في مكان آمن.</label></div></section><section class="panel"><h2>الأجهزة والتطبيقات</h2><div class="item"><input type="checkbox"><label>حدّث نظام التشغيل والمتصفح والتطبيقات.</label></div><div class="item"><input type="checkbox"><label>راجع التطبيقات والأذونات واحذف غير الضروري.</label></div><div class="item"><input type="checkbox"><label>راجع الأجهزة والجلسات النشطة وأنهِ المجهول منها.</label></div></section><section class="panel"><h2>البريد والخصوصية</h2><div class="item"><input type="checkbox"><label>أمّن البريد الإلكتروني المرتبط بحساباتك.</label></div><div class="item"><input type="checkbox"><label>لا تشارك رموز التحقق أو كلمات المرور.</label></div><div class="item"><input type="checkbox"><label>تحقق من عنوان الموقع قبل تسجيل الدخول.</label></div></section><section class="panel"><h2>الاستعداد والاسترداد</h2><div class="item"><input type="checkbox"><label>حدّث خيارات الاسترداد ورقم الهاتف والبريد البديل.</label></div><div class="item"><input type="checkbox"><label>فعّل قفل الشاشة على هاتفك.</label></div><div class="item"><input type="checkbox"><label>احتفظ بنسخة احتياطية آمنة من الملفات المهمة.</label></div></section><p><button id="reset" type="button">إعادة ضبط العلامات</button></p></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')],bar=document.getElementById('bar'),count=document.getElementById('count');function update(){const n=boxes.filter(x=>x.checked).length;bar.style.width=(n/boxes.length*100)+'%';count.textContent=n+' من '+boxes.length+' خطوات مكتملة'}boxes.forEach(x=>x.addEventListener('change',update));document.getElementById('reset').addEventListener('click',()=>{boxes.forEach(x=>x.checked=false);update()});update();</script></body></html>
