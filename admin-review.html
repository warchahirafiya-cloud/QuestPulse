<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1b"><title>QuestPulse | مراجعة الإدارة</title>
<style>:root{color-scheme:dark;--bg:#090e1b;--panel:#121d31;--line:#ffffff20;--text:#f4f7ff;--muted:#a5b2c8;--cyan:#68d9d0;--violet:#a99bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 system-ui,Tahoma,Arial,sans-serif}.wrap{width:min(1050px,94%);margin:auto}header{border-bottom:1px solid var(--line)}nav{min-height:65px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.25rem;font-weight:900;color:var(--text);text-decoration:none}.brand span,a{color:var(--cyan)}main{padding:28px 0}.panel,.item{padding:17px;margin:13px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.muted{color:var(--muted)}.btn{border:0;border-radius:9px;padding:8px 13px;background:linear-gradient(110deg,var(--violet),var(--cyan));color:#091020;font:inherit;font-weight:800;cursor:pointer}.btn.alt{background:#ffffff0a;border:1px solid var(--line);color:var(--text)}.row{display:flex;gap:8px;flex-wrap:wrap}.item h3{margin:0}.status{color:var(--cyan);min-height:1.5em}.hidden{display:none!important}textarea{width:100%;min-height:65px;background:#0b1324;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
</style></head><body><header><div class="wrap"><nav><a class="brand" href="./index.html">Quest<span>Pulse</span> · الإدارة</a><a href="./publisher-account.html">حسابي</a></nav></div></header><main class="wrap"><h1>مراجعة الناشرين والمنشورات</h1><p id="guard" class="muted">جارٍ التحقق من صلاحية الإدارة…</p><div id="dashboard" class="hidden">
<section class="panel"><h2>طلبات حسابات الناشرين</h2><div id="users"></div></section>
<section class="panel"><h2>المنشورات قيد المراجعة</h2><div id="posts"></div></section>
<p id="status" class="status" role="status"></p></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=r.status===204?{}:await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n}
async function load(){const me=await api("/api/auth/me");if(me.user.role!=="admin")throw Error("هذه الصفحة مخصصة للإدارة فقط.");$("guard").textContent="تم التحقق من صلاحية الإدارة.";$("dashboard").classList.remove("hidden");const [users,posts]=await Promise.all([api("/api/admin/users?status=pending"),api("/api/admin/submissions?status=pending")]);$("users").replaceChildren();$("posts").replaceChildren();
users.users.forEach(u=>{const box=node("article","","item");box.append(node("h3",u.displayName));box.append(node("p",u.email+" · "+u.accountType+" · "+u.createdAt,"muted"));const actions=node("div","","row");const approve=node("button","تفعيل الحساب","btn");approve.onclick=()=>act("/api/admin/users/"+encodeURIComponent(u.id)+"/activate",{status:"active"});const reject=node("button","تعليق الحساب","btn alt");reject.onclick=()=>act("/api/admin/users/"+encodeURIComponent(u.id)+"/activate",{status:"suspended"});actions.append(approve,reject);box.append(actions);$("users").append(box)});
posts.submissions.forEach(p=>{const box=node("article","","item");box.append(node("h3",p.title));box.append(node("p",p.publisher_name+" · "+p.publisher_email+" · "+p.post_type,"muted"));box.append(node("p",p.description));box.append(node("p","الأهلية: "+p.countries+" · الإفصاح: "+p.disclosure));const note=document.createElement("textarea");note.placeholder="ملاحظة للمراجع أو الناشر (اختياري)";const actions=node("div","","row");for(const [action,label] of [["approve","قبول ونشر"],["request_changes","طلب تعديل"],["reject","رفض"]]){const b=node("button",label,"btn"+(action==="approve"?"":" alt"));b.onclick=()=>act("/api/admin/posts/"+encodeURIComponent(p.id)+"/review",{action,note:note.value});actions.append(b)}box.append(note,actions);$("posts").append(box)});
if(!users.users.length)$("users").append(node("p","لا توجد طلبات حسابات معلقة.","muted"));if(!posts.submissions.length)$("posts").append(node("p","لا توجد منشورات معلقة.","muted"))}
async function act(url,body){try{await api(url,{method:"PATCH",body:JSON.stringify(body)});$("status").textContent="تم تحديث الحالة.";await load()}catch(e){$("status").textContent=e.message}}
load().catch(e=>{$("guard").textContent=e.message;if(e.message.includes("Authentication"))location.href="./publisher-account.html"})})();
</script></body></html>
