name: Validate opportunity registry

on:
  push:
    paths:
      - "data/opportunities.json"
      - "scripts/validate-opportunities.mjs"
      - ".github/workflows/validate-opportunities.yml"
  pull_request:
    paths:
      - "data/opportunities.json"
      - "scripts/validate-opportunities.mjs"
      - ".github/workflows/validate-opportunities.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate opportunity registry
        run: node scripts/validate-opportunities.mjs
