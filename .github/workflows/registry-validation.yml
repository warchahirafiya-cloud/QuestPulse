name: QuestPulse registry validation

on:
  push:
    branches: [main]
    paths:
      - "data/opportunities.json"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/registry-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/opportunities.json"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/registry-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate opportunity registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JSON structure and safety rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'data/opportunities.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const fail = (message) => {
            console.error('Registry validation failed: ' + message);
            process.exitCode = 1;
          };
          const allowed = {
            status: new Set(['verified', 'under_review', 'unverified', 'paused', 'expired']),
            availability: new Set(['available', 'limited', 'unknown', 'paused', 'expired']),
            riskLevel: new Set(['low', 'medium', 'high', 'unrated'])
          };
          const https = (value) => {
            try { return new URL(value).protocol === 'https:'; }
            catch { return false; }
          };
          const validDate = (value) =>
            typeof value === 'string' && value.trim() !== '' && !Number.isNaN(Date.parse(value));

          if (data.schemaVersion !== 1) fail('schemaVersion must equal 1');
          if (!Array.isArray(data.opportunities)) fail('opportunities must be an array');
          if (!validDate(data.updatedAt)) fail('updatedAt must be a valid date');

          const seen = new Set();
          for (const [index, item] of (data.opportunities || []).entries()) {
            const label = item?.id || `record #${index + 1}`;
            if (!item || typeof item !== 'object' || Array.isArray(item)) {
              fail(`${label} must be an object`);
              continue;
            }
            if (typeof item.id !== 'string' || !item.id.trim()) fail(`${label}: missing id`);
            if (seen.has(item.id)) fail(`${label}: duplicate id`);
            seen.add(item.id);

            for (const field of ['status', 'availability', 'riskLevel']) {
              if (!allowed[field].has(item[field])) fail(`${label}: invalid ${field}`);
            }
            if (item.officialUrl != null && !https(item.officialUrl)) {
              fail(`${label}: officialUrl must use HTTPS`);
            }
            if (item.verificationSources != null && !Array.isArray(item.verificationSources)) {
              fail(`${label}: verificationSources must be an array`);
            }
            for (const source of item.verificationSources || []) {
              if (!source || !https(source.url)) fail(`${label}: every verification source must use HTTPS`);
            }

            if (item.status === 'verified') {
              if (!https(item.officialUrl)) fail(`${label}: verified record needs an HTTPS officialUrl`);
              if (!validDate(item.reviewedAt)) fail(`${label}: verified record needs a valid reviewedAt date`);
              else if (Date.parse(item.reviewedAt) > Date.now() + 5 * 60 * 1000) fail(`${label}: reviewedAt cannot be in the future`);
              const validSource = (item.verificationSources || []).some(
                source => https(source?.url) &&
                  typeof source.checkedFor === 'string' && source.checkedFor.trim()
              );
              if (!validSource) fail(`${label}: verified record needs an HTTPS source with checkedFor`);
            }
          }

          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Registry valid: ${seen.size} records checked.`);
          NODE

      - name: Run static PWA and dashboard smoke checks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const inlineScripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim());
          for (const [index, source] of inlineScripts.entries()) {
            try {
              new (await import('node:vm')).Script(source, { filename: `index.html:inline-script-${index + 1}` });
            } catch (error) {
              console.error(`Inline JavaScript syntax error in script ${index + 1}:`, error.message);
              process.exit(1);
            }
          }
          const requiredHtml = [
            'id="qpMonitorMetrics"',
            'id="qpRiskBreakdown"',
            'id="qpReviewQueue"',
            'id="qpChangeAlerts"',
            'id="qpSidebar"',
            'id="qpMenuToggle"',
            'function renderQpMonitor',
            'function monitorOpportunityChanges',
            'Array.isArray(stored)',
            'Object.create(null)',
            'n.detail.slice(0,500)',
            './data/opportunities.json',
            'serviceWorker.register',
            'function verifyRuntime()',
            'Promise.allSettled',
            'data-state="checking"',
            'data-state==="ok"',
            'actions/workflows/registry-validation.yml/badge.svg',
            'registry HTTP '
          ];
          const missing = requiredHtml.filter(value => !html.includes(value));
          if (missing.length) {
            console.error('Missing required dashboard/PWA hooks:', missing.join(', '));
            process.exit(1);
          }
          const swRegistrations = (html.match(/serviceWorker\\.register\\s*\\(/g) || []).length;
          if (swRegistrations !== 1) {
            console.error(`Expected exactly one Service Worker registration, found ${swRegistrations}.`);
            process.exit(1);
          }
          if (!sw.includes('addEventListener("install"') ||
              !sw.includes('addEventListener("activate"') ||
              !sw.includes('addEventListener("fetch"')) {
            console.error('Service worker lifecycle handlers are incomplete.');
            process.exit(1);
          }
          if (manifest.name !== 'QuestPulse — Web3 Discovery' ||
              manifest.display !== 'standalone' ||
              manifest.start_url !== './' ||
              !Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            console.error('PWA manifest is missing required install metadata.');
            process.exit(1);
          }
          for (const icon of manifest.icons) {
            const path = icon.src.replace(/^\.\//, '');
            if (!fs.existsSync(path)) {
              console.error('PWA icon file not found:', path);
              process.exit(1);
            }
          }
          console.log('Static smoke checks passed: dashboard, sidebar, registry, service worker and PWA manifest.');
          NODE
