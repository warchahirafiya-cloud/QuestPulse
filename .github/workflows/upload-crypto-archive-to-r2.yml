name: Upload Crypto Archive to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-crypto-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build crypto archive
        run: |
          set -euo pipefail
          test -d archive/crypto
          zip -r QuestPulse-crypto-archive.zip archive/crypto
          test -s QuestPulse-crypto-archive.zip
          ls -lh QuestPulse-crypto-archive.zip

      - name: Upload crypto archive to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${ACCOUNT_ID}" ]; then
            echo "Missing one or more required GitHub Actions secrets."
            exit 1
          fi
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp QuestPulse-crypto-archive.zip s3://questpulse-archive/QuestPulse-crypto-archive.zip --endpoint-url "${ENDPOINT}"
          aws s3api head-object --bucket questpulse-archive --key QuestPulse-crypto-archive.zip --endpoint-url "${ENDPOINT}"
