name: QuestPulse quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rewards website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check all backend and test JavaScript syntax
        run: |
          for file in server/*.js server/tests/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Test publisher API validation and security helpers
        run: npm run test:api
      - name: Validate ML governance and human feedback contracts
        run: npm run validate:ml
      - name: Validate website pages
        run: node scripts/validate-site.mjs
      - name: Validate published offers catalogue
        run: node scripts/validate-offers.mjs
      - name: Validate candidate review inbox
        run: node scripts/validate-inbox.mjs
