name: QuestPulse quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rewards website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Test publisher API validation
        run: npm run test:api
      - name: Validate website pages
        run: node scripts/validate-site.mjs
      - name: Validate published offers catalogue
        run: node scripts/validate-offers.mjs
      - name: Validate candidate review inbox
        run: node scripts/validate-inbox.mjs
