name: Build Crypto Archive ZIP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create archive ZIP
        run: |
          set -euo pipefail
          test -d archive/crypto
          zip -r QuestPulse-crypto-archive.zip archive/crypto
          ls -lh QuestPulse-crypto-archive.zip
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestPulse-crypto-archive
          path: QuestPulse-crypto-archive.zip
          if-no-files-found: error
          retention-days: 30
