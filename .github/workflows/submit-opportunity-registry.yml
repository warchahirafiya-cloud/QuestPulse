name: Submit opportunity registry for review

on:
  workflow_dispatch:
    inputs:
      registry_json:
        description: "Paste the complete JSON exported from the QuestPulse editor"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-open-review:
    name: Validate registry and open a pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Safely import submitted JSON
        env:
          REGISTRY_JSON: ${{ inputs.registry_json }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const raw = process.env.REGISTRY_JSON;
          if (!raw || raw.length > 60000) throw new Error("Registry JSON is empty or exceeds the supported input size.");
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.schemaVersion !== 1 || !Array.isArray(parsed.opportunities)) {
            throw new Error("Unsupported registry format.");
          }
          await writeFile("data/opportunities.json", JSON.stringify(parsed, null, 2) + "\n", "utf8");
          NODE

      - name: Run registry and site validation
        run: |
          node scripts/validate-opportunity-registry.mjs
          node scripts/validate-site.mjs

      - name: Open a review pull request
        uses: actions/github-script@v7
        env:
          REGISTRY_JSON: ${{ inputs.registry_json }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = `review/opportunity-registry-${context.runId}`;
            const base = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: base.data.commit.sha
            });
            const current = await github.rest.repos.getContent({
              owner, repo, path: "data/opportunities.json", ref: "main"
            });
            const parsed = JSON.parse(process.env.REGISTRY_JSON);
            const content = Buffer.from(JSON.stringify(parsed, null, 2) + "\n", "utf8").toString("base64");
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path: "data/opportunities.json",
              message: "Submit opportunity registry for editorial review",
              content, sha: current.data.sha
            });
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: "main",
              title: "Review opportunity registry update",
              body: [
                "## Editorial review required",
                "",
                "This pull request was generated by the QuestPulse registry submission workflow.",
                "",
                "- Automated registry and site checks passed before this PR was opened.",
                "- Review every official URL, verification source, payment evidence, withdrawal term, eligibility condition, and risk note.",
                "- A verified status is an editorial status only; it is not a guarantee of safety, rewards, or future availability.",
                "- Merge only after a human reviewer confirms the evidence.",
                "",
                "No personal access token is stored in the public site or editor."
              ].join("\n")
            });
            core.notice(`Review pull request created: ${pr.data.html_url}`);
