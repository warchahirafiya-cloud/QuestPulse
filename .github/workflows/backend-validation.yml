name: QuestPulse backend validation

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Test read-only API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend contract tests
        working-directory: backend
        run: node --experimental-default-type=module --test tests/worker.test.js
