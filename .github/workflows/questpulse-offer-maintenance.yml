name: QuestPulse offer maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/offers.json"
      - "data/inbox.json"
      - "data/sources.json"
      - "scripts/refresh-offers.mjs"
      - "scripts/validate-offers.mjs"
      - "scripts/validate-inbox.mjs"
      - "scripts/ingest-offer-feeds.mjs"
      - ".github/workflows/questpulse-offer-maintenance.yml"

concurrency:
  group: questpulse-offer-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    name: Discover candidates, expire offers, and validate catalogues
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover candidates from approved feeds
        run: node scripts/ingest-offer-feeds.mjs
      - name: Expire ended offers
        run: node scripts/refresh-offers.mjs
      - name: Validate published offers
        run: node scripts/validate-offers.mjs
      - name: Validate candidate review inbox
        run: node scripts/validate-inbox.mjs
      - name: Commit catalogue maintenance and review inbox
        run: |
          if ! git diff --quiet -- data/offers.json data/inbox.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/offers.json data/inbox.json
            git commit -m "chore: refresh offer candidates and expire outdated offers"
            git pull --rebase origin main
            git push
          fi
