name: Deploy QuestPulse to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build a safe public website directory
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/data

          # Public website pages and root-level static assets only.
          cp ./*.html _site/
          rm -f _site/admin-review.html
          cp ./*.css _site/
          cp ./*.js _site/
          cp CNAME manifest.webmanifest robots.txt sitemap.xml _site/
          cp assets/questpulse-icon.svg _site/assets/
          cp data/offers.json _site/data/

          # Deliberately exclude server code, backups, internal documentation,
          # scripts, schemas, ML files, candidate inboxes and historical archives.
          test -s _site/index.html
          test -s _site/data/offers.json
          test -s _site/CNAME
          test ! -e _site/data/inbox.json
          test ! -e _site/server
          test ! -e _site/admin-review.html
          test ! -e _site/backups
          test ! -e _site/archive

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: _site

      - name: Deploy to GitHub Pages without creating a Pages site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}
